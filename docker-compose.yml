services:
  # ─── PostgreSQL Database ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: gumroad_app3
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible file storage) ────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Database Migrations (run once, then exit) ────────────────────
  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/gumroad_app3
    command: ["bun", "x", "prisma", "db", "push", "--schema", "packages/db/prisma/schema.prisma", "--accept-data-loss"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ─── Backend (Express API) ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      # ── Core ──
      PORT: "3002"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/gumroad_app3

      # ── Better Auth ──
      BETTER_AUTH_SECRET: riyan@9822@9822611164@sayyad
      BETTER_AUTH_URL: http://localhost:3002
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003

      # ── CORS ──
      CORS_ORIGIN: http://localhost:3000

      # ── S3 / MinIO ──
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: gumroad-files
      S3_REGION: us-east-1

      # ── OAuth (GitHub) ──
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # ── OAuth (Google) ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  # ─── Frontend (Next.js) ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/gumroad_app3
        NEXT_PUBLIC_API_URL: http://localhost:3002
        NEXT_PUBLIC_AUTH_URL: http://localhost:3002
    restart: unless-stopped
    environment:
      # ── Runtime env vars for Next.js server-side ──
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/gumroad_app3
      BETTER_AUTH_SECRET: riyan@9822@9822611164@sayyad
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ─── WebSocket Server ────────────────────────────────────────────
  ws:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/gumroad_app3
      BETTER_AUTH_SECRET: riyan@9822@9822611164@sayyad
      BETTER_AUTH_URL: http://localhost:3002
      NODE_ENV: production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  minio-data:
